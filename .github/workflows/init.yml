name: Setup VinAI Study Otomatis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Generate Semua File Proyek
        run: |
          # Buat struktur direktori
          mkdir -p .github/workflows api backend data src/components src/context src/pages src/services src/types

          # 1. package.json
          cat << 'EOF' > package.json
          {
            "name": "vinai-study",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "tsc && vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "react": "^18.2.0",
              "react-dom": "^18.2.0"
            },
            "devDependencies": {
              "@types/node": "^20.11.0",
              "@types/react": "^18.2.55",
              "@types/react-dom": "^18.2.19",
              "@vercel/node": "^3.0.18",
              "@vitejs/plugin-react": "^4.2.1",
              "autoprefixer": "^10.4.17",
              "postcss": "^8.4.35",
              "tailwindcss": "^3.4.1",
              "typescript": "^5.2.2",
              "vite": "^5.1.0"
            }
          }
          EOF

          # 2. tsconfig.json
          cat << 'EOF' > tsconfig.json
          {
            "compilerOptions": {
              "target": "ES2020",
              "useDefineForClassFields": true,
              "lib": ["ES2020", "DOM", "DOM.Iterable"],
              "module": "ESNext",
              "skipLibCheck": true,
              "moduleResolution": "bundler",
              "allowImportingTsExtensions": true,
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "strict": true,
              "noUnusedLocals": true,
              "noUnusedParameters": true,
              "noFallthroughCasesInSwitch": true
            },
            "include": ["src", "api"]
          }
          EOF

          # 3. vite.config.ts
          cat << 'EOF' > vite.config.ts
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';

          export default defineConfig({
            plugins: [react()],
          });
          EOF

          # 4. tailwind & postcss & vercel
          cat << 'EOF' > tailwind.config.js
          /** @type {import('tailwindcss').Config} */
          export default {
            content: ["./index.html", "./src/**/*.{js,ts,jsx,tsx}"],
            theme: { extend: {} },
            plugins: [],
          }
          EOF

          cat << 'EOF' > postcss.config.js
          export default {
            plugins: {
              tailwindcss: {},
              autoprefixer: {},
            },
          }
          EOF

          cat << 'EOF' > vercel.json
          {
            "buildCommand": "npm run build",
            "outputDirectory": "dist",
            "framework": "vite"
          }
          EOF

          # 5. index.html & data
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="id">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>VinAI Study — AI PR Berbasis Buku</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          EOF

          echo "[]" > data/materials.json

          # 6. Backend Requirements
          cat << 'EOF' > backend/requirements.txt
          fastapi==0.110.0
          uvicorn==0.28.0
          pydantic==2.6.4
          pytesseract==0.3.10
          Pillow==10.2.0
          google-generativeai==0.4.1
          requests==2.31.0
          python-multipart==0.0.9
          EOF

          # 7. Backend github_storage.py
          cat << 'EOF' > backend/github_storage.py
          import os, json, base64, requests
          from typing import List, Dict, Any

          GITHUB_PAT = os.environ.get("GH_PAT", "")
          GITHUB_REPO = os.environ.get("GITHUB_REPOSITORY", "")
          DATA_FILE_PATH = "data/materials.json"

          HEADERS = {
              "Authorization": f"Bearer {GITHUB_PAT}",
              "Accept": "application/vnd.github.v3+json"
          }

          def get_materials() -> List[Dict[str, Any]]:
              if not GITHUB_PAT or not GITHUB_REPO:
                  if os.path.exists(DATA_FILE_PATH):
                      with open(DATA_FILE_PATH, "r", encoding="utf-8") as f:
                          return json.load(f)
                  return []

              url = f"https://api.github.com/repos/{GITHUB_REPO}/contents/{DATA_FILE_PATH}"
              resp = requests.get(url, headers=HEADERS)
              if resp.status_code == 200:
                  data = resp.json()
                  content = base64.b64decode(data["content"]).decode("utf-8")
                  return json.loads(content)
              return []

          def save_material(new_entry: Dict[str, Any]) -> bool:
              materials = get_materials()
              materials.append(new_entry)
              content_str = json.dumps(materials, indent=2, ensure_ascii=False)
              content_b64 = base64.b64encode(content_str.encode("utf-8")).decode("utf-8")

              if not GITHUB_PAT or not GITHUB_REPO:
                  os.makedirs(os.path.dirname(DATA_FILE_PATH), exist_ok=True)
                  with open(DATA_FILE_PATH, "w", encoding="utf-8") as f:
                      f.write(content_str)
                  return True

              url = f"https://api.github.com/repos/{GITHUB_REPO}/contents/{DATA_FILE_PATH}"
              resp = requests.get(url, headers=HEADERS)
              payload = {
                  "message": f"feat: tambah materi {new_entry.get('subject')} hal {new_entry.get('page_number')}",
                  "content": content_b64
              }
              if resp.status_code == 200:
                  payload["sha"] = resp.json()["sha"]

              put_resp = requests.put(url, headers=HEADERS, json=payload)
              return put_resp.status_code in [200, 201]

          def delete_material_by_id(material_id: str) -> bool:
              materials = get_materials()
              filtered = [m for m in materials if m.get("id") != material_id]
              if len(filtered) == len(materials):
                  return False

              content_str = json.dumps(filtered, indent=2, ensure_ascii=False)
              content_b64 = base64.b64encode(content_str.encode("utf-8")).decode("utf-8")

              url = f"https://api.github.com/repos/{GITHUB_REPO}/contents/{DATA_FILE_PATH}"
              resp = requests.get(url, headers=HEADERS)
              if resp.status_code != 200:
                  return False

              payload = {
                  "message": f"feat: hapus materi ID {material_id}",
                  "content": content_b64,
                  "sha": resp.json()["sha"]
              }
              put_resp = requests.put(url, headers=HEADERS, json=payload)
              return put_resp.status_code == 200
          EOF

          # 8. Backend rag.py
          cat << 'EOF' > backend/rag.py
          import os, re
          from typing import List, Dict, Any
          import google.generativeai as genai

          GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY", "")
          if GEMINI_API_KEY:
              genai.configure(api_key=GEMINI_API_KEY)

          def score_relevance(query: str, text: str) -> float:
              q_words = set(re.findall(r'\b[a-zA-Z0-9]{3,}\b', query.lower()))
              if not q_words:
                  return 0.0
              t_words = set(re.findall(r'\b[a-zA-Z0-9]{3,}\b', text.lower()))
              return len(q_words.intersection(t_words)) / len(q_words)

          def retrieve_context(query: str, subject: str, materials: List[Dict[str, Any]], top_k: int = 4) -> List[Dict[str, Any]]:
              matched = []
              for item in materials:
                  if subject.lower() != "semua" and item.get("subject", "").lower() != subject.lower():
                      continue
                  score = score_relevance(query, item.get("content", ""))
                  matched.append((score, item))
              matched.sort(key=lambda x: x[0], reverse=True)
              return [item for score, item in matched if score > 0][:top_k]

          def answer_homework(question: str, subject: str, materials: List[Dict[str, Any]]) -> Dict[str, Any]:
              relevant_chunks = retrieve_context(question, subject, materials)
              if not relevant_chunks:
                  return {
                      "answer": "Jawaban belum ditemukan dalam materi buku yang kamu unggah.",
                      "citations": [],
                      "retrieved_count": 0
                  }

              context_str = ""
              citations = []
              for idx, c in enumerate(relevant_chunks, 1):
                  ref = f"Mata Pelajaran: {c.get('subject')}, Bab: {c.get('chapter')}, Hal: {c.get('page_number')}"
                  citations.append(ref)
                  context_str += f"\n--- Sumber {idx} ({ref}) ---\n{c.get('content')}\n"

              system_instruction = (
                  "Kamu adalah VinAI Study, asisten belajar PR berbasis HANYA pada buku sekolah milik pengguna.\n"
                  "ATURAN MUTLAK:\n"
                  "1. Gunakan HANYA informasi yang tertulis di 'Konteks Materi Buku' berikut ini.\n"
                  "2. JANGAN menggunakan pengetahuan umum atau internet luar.\n"
                  "3. Jika jawaban sama sekali tidak dijelaskan di konteks buku, kamu WAJIB menjawab persis:\n"
                  "'Jawaban belum ditemukan dalam materi buku yang kamu unggah.'\n"
                  "4. Tuliskan rujukan bab dan halaman di akhir jawaban."
              )

              prompt = f"{system_instruction}\n\nKonteks Materi Buku:\n{context_str}\n\nPertanyaan PR:\n{question}\n\nJawaban:"

              if not GEMINI_API_KEY:
                  return {
                      "answer": "GEMINI_API_KEY belum terpasang. Teks buku ditemukan, namun generator AI belum dikonfigurasi.",
                      "citations": citations,
                      "retrieved_count": len(relevant_chunks)
                  }

              try:
                  model = genai.GenerativeModel("gemini-1.5-flash")
                  response = model.generate_content(prompt)
                  return {
                      "answer": response.text.strip() if response.text else "Gagal menghasilkan respon.",
                      "citations": citations,
                      "retrieved_count": len(relevant_chunks)
                  }
              except Exception as e:
                  return {
                      "answer": f"Terjadi kesalahan AI: {str(e)}",
                      "citations": citations,
                      "retrieved_count": len(relevant_chunks)
                  }
          EOF

          # 9. Backend main.py
          cat << 'EOF' > backend/main.py
          import os, uuid, base64, io
          from fastapi import FastAPI, HTTPException, Header, Depends
          from fastapi.middleware.cors import CORSMiddleware
          from pydantic import BaseModel
          from typing import Optional
          from PIL import Image
          import pytesseract
          from backend.github_storage import get_materials, save_material, delete_material_by_id
          from backend.rag import answer_homework

          BACKEND_API_KEY = os.environ.get("BACKEND_API_KEY", "vinai-secret-default")
          app = FastAPI(title="VinAI Study Engine")

          app.add_middleware(
              CORSMiddleware,
              allow_origins=["*"],
              allow_credentials=True,
              allow_methods=["*"],
              allow_headers=["*"],
          )

          def verify_token(authorization: Optional[str] = Header(None)):
              if not authorization or not authorization.startswith("Bearer "):
                  raise HTTPException(status_code=401, detail="Header Authorization tidak valid")
              if authorization.split(" ")[1] != BACKEND_API_KEY:
                  raise HTTPException(status_code=403, detail="Akses ditolak")

          class OCRRequest(BaseModel):
              image_base64: str

          class MaterialCreateRequest(BaseModel):
              subject: str
              grade: str
              chapter: str
              page_number: str
              content: str

          class AskRequest(BaseModel):
              question: str
              subject: str
              question_image_base64: Optional[str] = None

          @app.get("/health")
          def health_check():
              return {"status": "ok", "service": "VinAI Study Engine"}

          @app.post("/api/ocr", dependencies=[Depends(verify_token)])
          def extract_ocr(payload: OCRRequest):
              try:
                  raw_b64 = payload.image_base64.split(",")[1] if "," in payload.image_base64 else payload.image_base64
                  image = Image.open(io.BytesIO(base64.b64decode(raw_b64))).convert("RGB")
                  text = pytesseract.image_to_string(image, lang="ind+eng")
                  cleaned = "\n".join([line.strip() for line in text.splitlines() if line.strip()])
                  return {"success": True, "extracted_text": cleaned}
              except Exception as e:
                  raise HTTPException(status_code=400, detail=str(e))

          @app.get("/api/materials", dependencies=[Depends(verify_token)])
          def list_materials():
              return {"materials": get_materials()}

          @app.post("/api/materials", dependencies=[Depends(verify_token)])
          def create_material(data: MaterialCreateRequest):
              entry = {
                  "id": str(uuid.uuid4()),
                  "subject": data.subject,
                  "grade": data.grade,
                  "chapter": data.chapter,
                  "page_number": data.page_number,
                  "content": data.content
              }
              if not save_material(entry):
                  raise HTTPException(status_code=500, detail="Gagal menyimpan materi")
              return {"success": True, "material": entry}

          @app.delete("/api/materials/{material_id}", dependencies=[Depends(verify_token)])
          def delete_material(material_id: str):
              if not delete_material_by_id(material_id):
                  raise HTTPException(status_code=404, detail="Gagal menghapus")
              return {"success": True}

          @app.post("/api/ask", dependencies=[Depends(verify_token)])
          def ask_question(payload: AskRequest):
              q_text = payload.question
              if payload.question_image_base64:
                  try:
                      raw_b64 = payload.question_image_base64.split(",")[1] if "," in payload.question_image_base64 else payload.question_image_base64
                      img = Image.open(io.BytesIO(base64.b64decode(raw_b64)))
                      ocr_q = pytesseract.image_to_string(img, lang="ind+eng").strip()
                      if ocr_q:
                          q_text = f"{q_text}\n[Teks dari foto soal]: {ocr_q}".strip()
                  except Exception:
                      pass
              return answer_homework(q_text, payload.subject, get_materials())
          EOF

          # 10. Vercel Serverless Functions (api/...)
          cat << 'EOF' > api/backend-url.ts
          import type { VercelRequest, VercelResponse } from '@vercel/node';

          export default async function handler(req: VercelRequest, res: VercelResponse) {
            res.setHeader('Cache-Control', 'no-store, max-age=0');
            const owner = process.env.GITHUB_REPO_OWNER;
            const repo = process.env.GITHUB_REPO_NAME;
            const pat = process.env.GITHUB_PAT;

            if (!owner || !repo || !pat) {
              return res.status(500).json({ error: 'Config Vercel belum lengkap.' });
            }

            try {
              const headers = { Authorization: `Bearer ${pat}`, Accept: 'application/vnd.github+json', 'User-Agent': 'VinAI' };
              const [urlRes, statusRes] = await Promise.all([
                fetch(`https://api.github.com/repos/${owner}/${repo}/actions/variables/BACKEND_URL`, { headers }),
                fetch(`https://api.github.com/repos/${owner}/${repo}/actions/variables/BACKEND_STATUS`, { headers }),
              ]);

              const backendUrl = urlRes.ok ? (await urlRes.json()).value || '' : '';
              const backendStatus = statusRes.ok ? (await statusRes.json()).value || 'offline' : 'offline';

              return res.status(200).json({ url: backendUrl, status: backendStatus });
            } catch (err: any) {
              return res.status(500).json({ error: err.message });
            }
          }
          EOF

          cat << 'EOF' > api/start-server.ts
          import type { VercelRequest, VercelResponse } from '@vercel/node';

          export default async function handler(req: VercelRequest, res: VercelResponse) {
            if (req.method !== 'POST') return res.status(405).json({ error: 'Method not allowed' });
            const clientPin = req.headers['x-app-pin'] || req.body?.pin;
            if (clientPin !== (process.env.APP_PIN || '123456')) {
              return res.status(403).json({ error: 'PIN salah' });
            }

            const owner = process.env.GITHUB_REPO_OWNER;
            const repo = process.env.GITHUB_REPO_NAME;
            const pat = process.env.GITHUB_PAT;

            try {
              const dispatchRes = await fetch(
                `https://api.github.com/repos/${owner}/${repo}/actions/workflows/backend-runner.yml/dispatches`,
                {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${pat}`, Accept: 'application/vnd.github+json', 'User-Agent': 'VinAI' },
                  body: JSON.stringify({ ref: 'main' }),
                }
              );
              return dispatchRes.ok ? res.status(200).json({ success: true }) : res.status(500).json({ error: 'Gagal dispatch workflow' });
            } catch (err: any) {
              return res.status(500).json({ error: err.message });
            }
          }
          EOF

          cat << 'EOF' > api/stop-server.ts
          import type { VercelRequest, VercelResponse } from '@vercel/node';

          export default async function handler(req: VercelRequest, res: VercelResponse) {
            if (req.method !== 'POST') return res.status(405).json({ error: 'Method not allowed' });
            const clientPin = req.headers['x-app-pin'] || req.body?.pin;
            if (clientPin !== (process.env.APP_PIN || '123456')) return res.status(403).json({ error: 'PIN salah' });

            const owner = process.env.GITHUB_REPO_OWNER;
            const repo = process.env.GITHUB_REPO_NAME;
            const pat = process.env.GITHUB_PAT;

            try {
              const listRuns = await fetch(
                `https://api.github.com/repos/${owner}/${repo}/actions/workflows/backend-runner.yml/runs?status=in_progress`,
                { headers: { Authorization: `Bearer ${pat}`, Accept: 'application/vnd.github+json', 'User-Agent': 'VinAI' } }
              );
              if (listRuns.ok) {
                const data = await listRuns.json();
                for (const run of data.workflow_runs || []) {
                  await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs/${run.id}/cancel`, {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${pat}`, Accept: 'application/vnd.github+json', 'User-Agent': 'VinAI' }
                  });
                }
              }
              return res.status(200).json({ success: true });
            } catch (err: any) {
              return res.status(500).json({ error: err.message });
            }
          }
          EOF

          # 11. Workflow backend-runner.yml
          cat << 'EOF' > .github/workflows/backend-runner.yml
          name: VinAI Study Backend Runner

          on:
            workflow_dispatch:

          jobs:
            run-backend:
              runs-on: ubuntu-latest
              timeout-minutes: 90

              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"

                - name: Pasang Paket & OCR
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y tesseract-ocr tesseract-ocr-ind curl jq
                    pip install -r backend/requirements.txt
                    curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
                    sudo dpkg -i cloudflared.deb
                    rm cloudflared.deb

                - name: Jalankan FastAPI & Cloudflare Tunnel
                  env:
                    GH_PAT: ${{ secrets.GH_PAT }}
                    GH_TOKEN: ${{ secrets.GH_PAT }}
                    GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                    BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
                  run: |
                    python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
                    cloudflared tunnel --url http://127.0.0.1:8000 > tunnel.log 2>&1 &
                    
                    TUNNEL_URL=""
                    for i in {1..15}; do
                      sleep 2
                      FOUND_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
                      if [ -n "$FOUND_URL" ]; then
                        TUNNEL_URL="$FOUND_URL"
                        break
                      fi
                    done

                    if [ -z "$TUNNEL_URL" ]; then
                      echo "Gagal memperoleh tunnel"
                      exit 1
                    fi

                    gh variable set BACKEND_URL --body "$TUNNEL_URL"
                    gh variable set BACKEND_STATUS --body "online"

                - name: Loop Runtime (Maksimal 75 Menit)
                  run: sleep 4500

                - name: Cleanup
                  if: always()
                  env:
                    GH_TOKEN: ${{ secrets.GH_PAT }}
                  run: |
                    gh variable set BACKEND_URL --body "" || true
                    gh variable set BACKEND_STATUS --body "offline" || true
          EOF

          # 12. Frontend Types & Context & Services
          cat << 'EOF' > src/types/index.ts
          export type ServerState = 'idle' | 'starting' | 'online' | 'disconnected' | 'error';
          export interface Material {
            id: string;
            subject: string;
            grade: string;
            chapter: string;
            page_number: string;
            content: string;
          }
          export interface QuestionHistoryItem {
            id: string;
            timestamp: number;
            subject: string;
            question: string;
            answer: string;
            citations: string[];
          }
          EOF

          cat << 'EOF' > src/services/api.ts
          const BACKEND_SECRET_KEY = 'vinai-secret-default';

          export const callBackend = async (url: string, endpoint: string, options: RequestInit = {}) => {
            if (!url) throw new Error('URL Backend belum tersedia.');
            const headers = {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${BACKEND_SECRET_KEY}`,
              ...(options.headers || {}),
            };
            const res = await fetch(`${url}${endpoint}`, { ...options, headers });
            if (!res.ok) {
              const errorData = await res.json().catch(() => ({ detail: 'Kesalahan backend' }));
              throw new Error(errorData.detail || `Error ${res.status}`);
            }
            return res.json();
          };
          EOF

          cat << 'EOF' > src/context/ServerContext.tsx
          import React, { createContext, useContext, useState, useEffect, useCallback } from 'react';
          import { ServerState } from '../types';

          interface ServerContextType {
            status: ServerState;
            backendUrl: string;
            errorMessage: string;
            appPin: string;
            setAppPin: (pin: string) => void;
            startServer: () => Promise<void>;
            stopServer: () => Promise<void>;
            checkHealth: () => Promise<boolean>;
          }

          const ServerContext = createContext<ServerContextType | undefined>(undefined);

          export const ServerProvider: React.FC<{ children: React.ReactNode }> = ({ children }) => {
            const [status, setStatus] = useState<ServerState>('idle');
            const [backendUrl, setBackendUrl] = useState<string>('');
            const [errorMessage, setErrorMessage] = useState<string>('');
            const [appPin, setAppPin] = useState<string>(() => localStorage.getItem('vinai_pin') || '123456');

            const savePin = (pin: string) => {
              setAppPin(pin);
              localStorage.setItem('vinai_pin', pin);
            };

            const checkHealth = useCallback(async (urlToCheck?: string): Promise<boolean> => {
              const target = urlToCheck || backendUrl;
              if (!target) {
                setStatus('idle');
                return false;
              }
              try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 4000);
                const res = await fetch(`${target}/health`, { signal: controller.signal });
                clearTimeout(timer);
                if (res.ok) {
                  setStatus('online');
                  setErrorMessage('');
                  return true;
                }
                setStatus('disconnected');
                return false;
              } catch {
                setStatus('disconnected');
                return false;
              }
            }, [backendUrl]);

            const pollRegistry = useCallback(async () => {
              try {
                const res = await fetch('/api/backend-url');
                if (!res.ok) {
                  setStatus('error');
                  return;
                }
                const data = await res.json();
                if (data.url) {
                  setBackendUrl(data.url);
                  await checkHealth(data.url);
                } else {
                  setBackendUrl('');
                  setStatus('idle');
                }
              } catch {
                setStatus('error');
              }
            }, [checkHealth]);

            useEffect(() => {
              pollRegistry();
              const interval = setInterval(pollRegistry, 15000);
              return () => clearInterval(interval);
            }, [pollRegistry]);

            const startServer = async () => {
              setStatus('starting');
              setErrorMessage('');
              try {
                const res = await fetch('/api/start-server', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'x-app-pin': appPin },
                });
                if (!res.ok) throw new Error('Gagal menyalakan runner');
              } catch (err: any) {
                setStatus('error');
                setErrorMessage(err.message);
              }
            };

            const stopServer = async () => {
              await fetch('/api/stop-server', { method: 'POST', headers: { 'x-app-pin': appPin } }).catch(() => {});
              setStatus('idle');
              setBackendUrl('');
            };

            return (
              <ServerContext.Provider value={{ status, backendUrl, errorMessage, appPin, setAppPin: savePin, startServer, stopServer, checkHealth: () => checkHealth() }}>
                {children}
              </ServerContext.Provider>
            );
          };

          export const useServer = () => {
            const context = useContext(ServerContext);
            if (!context) throw new Error('useServer must be used within ServerProvider');
            return context;
          };
          EOF

