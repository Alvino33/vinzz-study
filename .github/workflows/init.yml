          import React, { useState } from 'react';
          import { useServer } from '../context/ServerContext';
          import { callBackend } from '../services/api';
          export const AskHomework: React.FC = () => {
            const { status, backendUrl, startServer } = useServer();
            const [subject, setSubject] = useState('Semua');
            const [question, setQuestion] = useState('');
            const [img, setImg] = useState<string | null>(null);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState<{ answer: string; citations: string[] } | null>(null);
            const [err, setErr] = useState('');

            const handleAsk = async (e: React.FormEvent) => {
              e.preventDefault();
              if (!question.trim() && !img) { setErr('Ketik soal atau unggah foto soal.'); return; }
              setErr(''); setLoading(true); setResult(null);
              try {
                const res = await callBackend(backendUrl, '/api/ask', { method: 'POST', body: JSON.stringify({ question, subject, question_image_base64: img }) });
                setResult(res);
                const h = JSON.parse(localStorage.getItem('vinai_history') || '[]');
                localStorage.setItem('vinai_history', JSON.stringify([{ id: Date.now().toString(), timestamp: Date.now(), subject, question: question || '(Foto)', answer: res.answer, citations: res.citations || [] }, ...h]));
              } catch (e: any) { setErr(e.message); } finally { setLoading(false); }
            };

            return (
              <div className="space-y-4 text-xs">
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                  <h2 className="font-bold text-sm text-slate-800">Tanya Soal PR</h2>
                  {status !== 'online' ? (
                    <div className="bg-amber-50 p-3 rounded text-center text-amber-800">
                      <p>Backend belum aktif.</p>
                      <button onClick={startServer} className="mt-2 bg-amber-600 text-white px-3 py-1.5 rounded font-bold">Nyalakan Runner</button>
                    </div>
                  ) : (
                    <form onSubmit={handleAsk} className="space-y-3">
                      <div>
                        <label className="block text-slate-600 mb-1">Mata Pelajaran</label>
                        <select value={subject} onChange={(e) => setSubject(e.target.value)} className="w-full border p-2 rounded bg-white">
                          <option value="Semua">Semua Pelajaran</option>
                          <option value="IPA">IPA / Biologi / Fisika / Kimia</option>
                          <option value="IPS">IPS / Geografi / Sejarah</option>
                          <option value="Matematika">Matematika</option>
                          <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-600 mb-1">Ketik Pertanyaan</label>
                        <textarea rows={3} value={question} onChange={(e) => setQuestion(e.target.value)} placeholder="Tuliskan soal PR..." className="w-full border p-2 rounded" />
                      </div>
                      <div>
                        <label className="block text-slate-600 mb-1">Foto Soal (Opsional)</label>
                        <input type="file" accept="image/*" capture="environment" onChange={(e) => {
                          const f = e.target.files?.[0];
                          if (f) { const r = new FileReader(); r.onload = () => setImg(r.result as string); r.readAsDataURL(f); }
                        }} />
                      </div>
                      {err && <p className="text-rose-600">{err}</p>}
                      <button type="submit" disabled={loading} className="w-full py-2.5 bg-indigo-600 text-white font-bold rounded-lg disabled:opacity-50">
                        {loading ? 'Mencari di dalam buku...' : 'Cari Jawaban'}
                      </button>
                    </form>
                  )}
                </div>
                {result && (
                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2">
                    <h3 className="font-bold text-slate-800">Jawaban:</h3>
                    <p className="text-slate-700 whitespace-pre-wrap">{result.answer}</p>
                    {result.citations.length > 0 && (
                      <div className="bg-slate-50 p-2 rounded border text-[11px] text-slate-600">
                        <span className="font-bold block">Sumber Halaman:</span>
                        {result.citations.map((c, i) => <div key={i}>• {c}</div>)}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          };
          EOF

          cat << 'EOF' > src/pages/UploadBook.tsx
          import React, { useState } from 'react';
          import { useServer } from '../context/ServerContext';
          import { callBackend } from '../services/api';
          export const UploadBook: React.FC = () => {
            const { status, backendUrl, startServer } = useServer();
            const [img, setImg] = useState<string | null>(null);
            const [ocrLoading, setOcrLoading] = useState(false);
            const [saveLoading, setSaveLoading] = useState(false);
            const [subject, setSubject] = useState('IPA');
            const [grade, setGrade] = useState('7');
            const [chapter, setChapter] = useState('');
            const [pageNumber, setPageNumber] = useState('');
            const [text, setText] = useState('');
            const [msg, setMsg] = useState('');

            const runOCR = async () => {
              if (!img) return;
              setOcrLoading(true); setMsg('');
              try {
                const res = await callBackend(backendUrl, '/api/ocr', { method: 'POST', body: JSON.stringify({ image_base64: img }) });
                setText(res.extracted_text || '');
              } catch (e: any) { setMsg(e.message); } finally { setOcrLoading(false); }
            };

            const handleSave = async (e: React.FormEvent) => {
              e.preventDefault();
              setSaveLoading(true);
              try {
                await callBackend(backendUrl, '/api/materials', {
                  method: 'POST', body: JSON.stringify({ subject, grade, chapter: chapter || 'Bab 1', page_number: pageNumber || '1', content: text })
                });
                setMsg('✅ Berhasil disimpan ke repositori!'); setText(''); setImg(null);
              } catch (e: any) { setMsg(e.message); } finally { setSaveLoading(false); }
            };

            return (
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3 text-xs">
                <h2 className="font-bold text-sm text-slate-800">Scan Halaman Buku</h2>
                {status !== 'online' ? (
                  <div className="bg-rose-50 p-3 rounded text-center text-rose-800">
                    <p>Runner belum aktif.</p>
                    <button onClick={startServer} className="mt-2 bg-rose-600 text-white px-3 py-1.5 rounded font-bold">Nyalakan Server</button>
                  </div>
                ) : (
                  <>
                    <input type="file" accept="image/*" capture="environment" onChange={(e) => {
                      const f = e.target.files?.[0];
                      if (f) { const r = new FileReader(); r.onload = () => { setImg(r.result as string); setText(''); }; r.readAsDataURL(f); }
                    }} />
                    {img && (
                      <div className="space-y-2">
                        <img src={img} alt="Foto Buku" className="max-h-40 mx-auto rounded border" />
                        <button onClick={runOCR} disabled={ocrLoading} className="w-full py-2 bg-emerald-600 text-white font-bold rounded">
                          {ocrLoading ? 'Membaca Teks (OCR)...' : 'Ekstrak Teks Buku'}
                        </button>
                      </div>
                    )}
                    {text && (
                      <form onSubmit={handleSave} className="space-y-2 pt-2 border-t">
                        <div className="grid grid-cols-2 gap-2">
                          <input type="text" placeholder="Mapel (contoh: IPA)" value={subject} onChange={(e) => setSubject(e.target.value)} required className="border p-1.5 rounded" />
                          <input type="text" placeholder="Kelas (contoh: 7)" value={grade} onChange={(e) => setGrade(e.target.value)} required className="border p-1.5 rounded" />
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <input type="text" placeholder="Bab (contoh: Bab 3)" value={chapter} onChange={(e) => setChapter(e.target.value)} required className="border p-1.5 rounded" />
                          <input type="text" placeholder="Hal (contoh: 45)" value={pageNumber} onChange={(e) => setPageNumber(e.target.value)} required className="border p-1.5 rounded" />
                        </div>
                        <textarea rows={5} value={text} onChange={(e) => setText(e.target.value)} className="w-full border p-2 rounded font-mono" />
                        <button type="submit" disabled={saveLoading} className="w-full py-2 bg-indigo-600 text-white font-bold rounded">
                          {saveLoading ? 'Menyimpan...' : 'Simpan Materi ke Database'}
                        </button>
                      </form>
                    )}
                    {msg && <p className="text-slate-600">{msg}</p>}
                  </>
                )}
              </div>
            );
          };
          EOF

