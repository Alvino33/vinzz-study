          import React, { useState } from 'react';
          import { useServer } from '../context/ServerContext';
          import { callBackend } from '../services/api';

          export const AskHomework: React.FC = () => {
            const { status, backendUrl, startServer } = useServer();
            const [subject, setSubject] = useState('Semua');
            const [question, setQuestion] = useState('');
            const [questionImage, setQuestionImage] = useState<string | null>(null);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState<{ answer: string; citations: string[] } | null>(null);
            const [error, setError] = useState('');

            const handleImage = (e: React.ChangeEvent<HTMLInputElement>) => {
              const file = e.target.files?.[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = () => setQuestionImage(reader.result as string);
              reader.readAsDataURL(file);
            };

            const handleAsk = async (e: React.FormEvent) => {
              e.preventDefault();
              if (!question.trim() && !questionImage) {
                setError('Isi pertanyaan atau unggah foto soal.');
                return;
              }
              setError('');
              setLoading(true);
              setResult(null);
              try {
                const data = await callBackend(backendUrl, '/api/ask', {
                  method: 'POST',
                  body: JSON.stringify({ question, subject, question_image_base64: questionImage }),
                });
                setResult({ answer: data.answer, citations: data.citations || [] });
                const existing = JSON.parse(localStorage.getItem('vinai_history') || '[]');
                localStorage.setItem('vinai_history', JSON.stringify([{ id: Date.now().toString(), timestamp: Date.now(), subject, question, answer: data.answer, citations: data.citations || [] }, ...existing]));
              } catch (err: any) {
                setError(err.message);
              } finally {
                setLoading(false);
              }
            };

            return (
              <div className="space-y-4">
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                  <h2 className="text-sm font-bold text-slate-800 mb-3">Tanya PR Sekolah</h2>
                  {status !== 'online' ? (
                    <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 text-center">
                      <p>Backend belum aktif. Nyalakan server terlebih dahulu.</p>
                      <button onClick={startServer} className="mt-2 bg-amber-600 text-white font-bold px-3 py-1.5 rounded-lg">Aktifkan Runner</button>
                    </div>
                  ) : (
                    <form onSubmit={handleAsk} className="space-y-3 text-xs">
                      <div>
                        <label className="block text-slate-600 mb-1 font-medium">Mata Pelajaran</label>
                        <select value={subject} onChange={(e) => setSubject(e.target.value)} className="w-full border p-2 rounded-lg bg-white">
                          <option value="Semua">Semua Mata Pelajaran</option>
                          <option value="Matematika">Matematika</option>
                          <option value="IPA">IPA / Biologi / Fisika / Kimia</option>
                          <option value="IPS">IPS / Geografi / Sejarah</option>
                          <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                          <option value="Bahasa Inggris">Bahasa Inggris</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-slate-600 mb-1 font-medium">Ketik Soal PR</label>
                        <textarea value={question} onChange={(e) => setQuestion(e.target.value)} rows={3} placeholder="Contoh: Apa pengertian teks eksposisi menurut bab 2?" className="w-full border p-2 rounded-lg" />
                      </div>

                      <div>
                        <label className="block text-slate-600 mb-1 font-medium">Foto Soal PR (Opsional)</label>
                        <input type="file" accept="image/*" capture="environment" onChange={handleImage} className="w-full text-xs" />
                      </div>

                      {error && <p className="text-rose-600">{error}</p>}
                      <button type="submit" disabled={loading} className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl shadow disabled:opacity-50">
                        {loading ? 'Mencari di dalam buku...' : 'Cari Jawaban'}
                      </button>
                    </form>
                  )}
                </div>

                {result && (
                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2">
                    <h3 className="font-bold text-xs text-slate-700">Hasil Jawaban:</h3>
                    <p className="text-xs text-slate-800 whitespace-pre-wrap">{result.answer}</p>
                    {result.citations.length > 0 && (
                      <div className="bg-slate-50 p-2 rounded text-[11px] text-slate-600 border">
                        <span className="font-bold block">Rujukan Halaman:</span>
                        {result.citations.map((c, i) => <div key={i}>• {c}</div>)}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          };
          EOF

