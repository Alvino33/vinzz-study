name: Setup VinAI Study Otomatis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # ==========================================
      # LANGKAH 1: ROOT CONFIG & DATA
      # ==========================================
      - name: 1. Buat Konfigurasi Root & Data
        run: |
          mkdir -p .github/workflows api backend data src/components src/context src/pages src/services src/types

          cat << 'EOF' > package.json
          {
            "name": "vinai-study",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "tsc && vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "react": "^18.2.0",
              "react-dom": "^18.2.0"
            },
            "devDependencies": {
              "@types/node": "^20.11.0",
              "@types/react": "^18.2.55",
              "@types/react-dom": "^18.2.19",
              "@vercel/node": "^3.0.18",
              "@vitejs/plugin-react": "^4.2.1",
              "autoprefixer": "^10.4.17",
              "postcss": "^8.4.35",
              "tailwindcss": "^3.4.1",
              "typescript": "^5.2.2",
              "vite": "^5.1.0"
            }
          }
          EOF

          cat << 'EOF' > tsconfig.json
          {
            "compilerOptions": {
              "target": "ES2020",
              "useDefineForClassFields": true,
              "lib": ["ES2020", "DOM", "DOM.Iterable"],
              "module": "ESNext",
              "skipLibCheck": true,
              "moduleResolution": "bundler",
              "allowImportingTsExtensions": true,
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "strict": true
            },
            "include": ["src", "api"]
          }
          EOF

          cat << 'EOF' > vite.config.ts
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          export default defineConfig({ plugins: [react()] });
          EOF

          cat << 'EOF' > tailwind.config.js
          /** @type {import('tailwindcss').Config} */
          export default {
            content: ["./index.html", "./src/**/*.{js,ts,jsx,tsx}"],
            theme: { extend: {} },
            plugins: [],
          }
          EOF

          cat << 'EOF' > postcss.config.js
          export default {
            plugins: { tailwindcss: {}, autoprefixer: {} }
          }
          EOF

          cat << 'EOF' > vercel.json
          {
            "buildCommand": "npm run build",
            "outputDirectory": "dist",
            "framework": "vite"
          }
          EOF

          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="id">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>VinAI Study — AI PR Berbasis Buku</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          EOF

          echo "[]" > data/materials.json

      # ==========================================
      # LANGKAH 2: BACKEND PYTHON & RAG
      # ==========================================
      - name: 2. Buat Backend Python
        run: |
          cat << 'EOF' > backend/requirements.txt
          fastapi==0.110.0
          uvicorn==0.28.0
          pydantic==2.6.4
          pytesseract==0.3.10
          Pillow==10.2.0
          google-generativeai==0.4.1
          requests==2.31.0
          python-multipart==0.0.9
          EOF

          cat << 'EOF' > backend/github_storage.py
          import os, json, base64, requests
          from typing import List, Dict, Any

          GITHUB_PAT = os.environ.get("GH_PAT", "")
          GITHUB_REPO = os.environ.get("GITHUB_REPOSITORY", "")
          DATA_FILE_PATH = "data/materials.json"
          HEADERS = {"Authorization": f"Bearer {GITHUB_PAT}", "Accept": "application/vnd.github.v3+json"}

          def get_materials() -> List[Dict[str, Any]]:
              if not GITHUB_PAT or not GITHUB_REPO:
                  if os.path.exists(DATA_FILE_PATH):
                      with open(DATA_FILE_PATH, "r", encoding="utf-8") as f:
                          return json.load(f)
                  return []
              url = f"https://api.github.com/repos/{GITHUB_REPO}/contents/{DATA_FILE_PATH}"
              resp = requests.get(url, headers=HEADERS)
              if resp.status_code == 200:
                  return json.loads(base64.b64decode(resp.json()["content"]).decode("utf-8"))
              return []

          def save_material(new_entry: Dict[str, Any]) -> bool:
              materials = get_materials()
              materials.append(new_entry)
              content_b64 = base64.b64encode(json.dumps(materials, indent=2, ensure_ascii=False).encode("utf-8")).decode("utf-8")
              if not GITHUB_PAT or not GITHUB_REPO:
                  os.makedirs("data", exist_ok=True)
                  with open(DATA_FILE_PATH, "w", encoding="utf-8") as f:
                      f.write(json.dumps(materials, indent=2))
                  return True
              url = f"https://api.github.com/repos/{GITHUB_REPO}/contents/{DATA_FILE_PATH}"
              resp = requests.get(url, headers=HEADERS)
              payload = {"message": f"feat: add material hal {new_entry.get('page_number')}", "content": content_b64}
              if resp.status_code == 200:
                  payload["sha"] = resp.json()["sha"]
              return requests.put(url, headers=HEADERS, json=payload).status_code in [200, 201]

          def delete_material_by_id(material_id: str) -> bool:
              materials = get_materials()
              filtered = [m for m in materials if m.get("id") != material_id]
              if len(filtered) == len(materials): return False
              content_b64 = base64.b64encode(json.dumps(filtered, indent=2).encode("utf-8")).decode("utf-8")
              url = f"https://api.github.com/repos/{GITHUB_REPO}/contents/{DATA_FILE_PATH}"
              resp = requests.get(url, headers=HEADERS)
              if resp.status_code != 200: return False
              payload = {"message": f"feat: delete {material_id}", "content": content_b64, "sha": resp.json()["sha"]}
              return requests.put(url, headers=HEADERS, json=payload).status_code == 200
          EOF

          cat << 'EOF' > backend/rag.py
          import os, re
          from typing import List, Dict, Any
          import google.generativeai as genai

          GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY", "")
          if GEMINI_API_KEY: genai.configure(api_key=GEMINI_API_KEY)

          def score_relevance(query: str, text: str) -> float:
              q_words = set(re.findall(r'\b[a-zA-Z0-9]{3,}\b', query.lower()))
              if not q_words: return 0.0
              t_words = set(re.findall(r'\b[a-zA-Z0-9]{3,}\b', text.lower()))
              return len(q_words.intersection(t_words)) / len(q_words)

          def retrieve_context(query: str, subject: str, materials: List[Dict[str, Any]], top_k: int = 4) -> List[Dict[str, Any]]:
              matched = []
              for item in materials:
                  if subject.lower() != "semua" and item.get("subject", "").lower() != subject.lower(): continue
                  score = score_relevance(query, item.get("content", ""))
                  matched.append((score, item))
              matched.sort(key=lambda x: x[0], reverse=True)
              return [item for score, item in matched if score > 0][:top_k]

          def answer_homework(question: str, subject: str, materials: List[Dict[str, Any]]) -> Dict[str, Any]:
              relevant = retrieve_context(question, subject, materials)
              if not relevant:
                  return {"answer": "Jawaban belum ditemukan dalam materi buku yang kamu unggah.", "citations": []}
              
              citations = [f"{c.get('subject')}, {c.get('chapter')}, Hal {c.get('page_number')}" for c in relevant]
              context = "\n".join([f"[{cit}]:\n{c.get('content')}" for cit, c in zip(citations, relevant)])
              prompt = f"Gunakan HANYA materi ini:\n{context}\n\nJawab soal: {question}\nJika tidak ada jawab persis: 'Jawaban belum ditemukan dalam materi buku yang kamu unggah.'"
              
              if not GEMINI_API_KEY:
                  return {"answer": "Kunci GEMINI_API_KEY belum disetel.", "citations": citations}
              try:
                  model = genai.GenerativeModel("gemini-1.5-flash")
                  res = model.generate_content(prompt)
                  return {"answer": res.text.strip(), "citations": citations}
              except Exception as e:
                  return {"answer": f"Error AI: {str(e)}", "citations": citations}
          EOF

          cat << 'EOF' > backend/main.py
          import os, uuid, base64, io
          from fastapi import FastAPI, HTTPException, Header, Depends
          from fastapi.middleware.cors import CORSMiddleware
          from pydantic import BaseModel
          from typing import Optional
          from PIL import Image
          import pytesseract
          from backend.github_storage import get_materials, save_material, delete_material_by_id
          from backend.rag import answer_homework

          BACKEND_API_KEY = os.environ.get("BACKEND_API_KEY", "vinai-secret-default")
          app = FastAPI()
          app.add_middleware(CORSMiddleware, allow_origins=["*"], allow_credentials=True, allow_methods=["*"], allow_headers=["*"])

          def verify_token(authorization: Optional[str] = Header(None)):
              if not authorization or authorization.split(" ")[-1] != BACKEND_API_KEY:
                  raise HTTPException(status_code=403, detail="Akses ditolak")

          class OCRReq(BaseModel): image_base64: str
          class MatReq(BaseModel): subject: str; grade: str; chapter: str; page_number: str; content: str
          class AskReq(BaseModel): question: str; subject: str; question_image_base64: Optional[str] = None

          @app.get("/health")
          def health(): return {"status": "ok"}

          @app.post("/api/ocr", dependencies=[Depends(verify_token)])
          def ocr(payload: OCRReq):
              raw = payload.image_base64.split(",")[-1]
              img = Image.open(io.BytesIO(base64.b64decode(raw))).convert("RGB")
              return {"extracted_text": pytesseract.image_to_string(img, lang="ind+eng")}

          @app.get("/api/materials", dependencies=[Depends(verify_token)])
          def get_mats(): return {"materials": get_materials()}

          @app.post("/api/materials", dependencies=[Depends(verify_token)])
          def create_mat(d: MatReq):
              item = {"id": str(uuid.uuid4()), "subject": d.subject, "grade": d.grade, "chapter": d.chapter, "page_number": d.page_number, "content": d.content}
              if not save_material(item): raise HTTPException(status_code=500, detail="Gagal simpan")
              return {"success": True, "material": item}

          @app.delete("/api/materials/{mat_id}", dependencies=[Depends(verify_token)])
          def del_mat(mat_id: str):
              if not delete_material_by_id(mat_id): raise HTTPException(status_code=404, detail="Gagal hapus")
              return {"success": True}

          @app.post("/api/ask", dependencies=[Depends(verify_token)])
          def ask(p: AskReq):
              q = p.question
              if p.question_image_base64:
                  raw = p.question_image_base64.split(",")[-1]
                  img = Image.open(io.BytesIO(base64.b64decode(raw)))
                  ocr_q = pytesseract.image_to_string(img, lang="ind+eng").strip()
                  if ocr_q: q += f"\n[Teks foto]: {ocr_q}"
              return answer_homework(q, p.subject, get_materials())
          EOF

      # ==========================================
      # LANGKAH 3: API VERCEL & WORKFLOW RUNNER
      # ==========================================
      - name: 3. Buat API Vercel & Runner Workflow
        run: |
          cat << 'EOF' > api/backend-url.ts
          import type { VercelRequest, VercelResponse } from '@vercel/node';
          export default async function handler(req: VercelRequest, res: VercelResponse) {
            res.setHeader('Cache-Control', 'no-store, max-age=0');
            const { GITHUB_REPO_OWNER: owner, GITHUB_REPO_NAME: repo, GITHUB_PAT: pat } = process.env;
            if (!owner || !repo || !pat) return res.status(500).json({ error: 'Config belum lengkap' });
            try {
              const headers = { Authorization: `Bearer ${pat}`, Accept: 'application/vnd.github+json' };
              const [u, s] = await Promise.all([
                fetch(`https://api.github.com/repos/${owner}/${repo}/actions/variables/BACKEND_URL`, { headers }),
                fetch(`https://api.github.com/repos/${owner}/${repo}/actions/variables/BACKEND_STATUS`, { headers })
              ]);
              return res.status(200).json({
                url: u.ok ? (await u.json()).value || '' : '',
                status: s.ok ? (await s.json()).value || 'offline' : 'offline'
              });
            } catch (e: any) { return res.status(500).json({ error: e.message }); }
          }
          EOF

          cat << 'EOF' > api/start-server.ts
          import type { VercelRequest, VercelResponse } from '@vercel/node';
          export default async function handler(req: VercelRequest, res: VercelResponse) {
            if (req.method !== 'POST') return res.status(405).json({ error: 'Method not allowed' });
            if ((req.headers['x-app-pin'] || req.body?.pin) !== (process.env.APP_PIN || '123456')) {
              return res.status(403).json({ error: 'PIN salah' });
            }
            const { GITHUB_REPO_OWNER: owner, GITHUB_REPO_NAME: repo, GITHUB_PAT: pat } = process.env;
            try {
              const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/backend-runner.yml/dispatches`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${pat}`, Accept: 'application/vnd.github+json' },
                body: JSON.stringify({ ref: 'main' }),
              });
              return r.ok ? res.status(200).json({ success: true }) : res.status(500).json({ error: 'Gagal dispatch' });
            } catch (e: any) { return res.status(500).json({ error: e.message }); }
          }
          EOF

          cat << 'EOF' > api/stop-server.ts
          import type { VercelRequest, VercelResponse } from '@vercel/node';
          export default async function handler(req: VercelRequest, res: VercelResponse) {
            if (req.method !== 'POST') return res.status(405).json({ error: 'Method not allowed' });
            if ((req.headers['x-app-pin'] || req.body?.pin) !== (process.env.APP_PIN || '123456')) return res.status(403).json({ error: 'PIN salah' });
            const { GITHUB_REPO_OWNER: owner, GITHUB_REPO_NAME: repo, GITHUB_PAT: pat } = process.env;
            try {
              const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/backend-runner.yml/runs?status=in_progress`, {
                headers: { Authorization: `Bearer ${pat}`, Accept: 'application/vnd.github+json' }
              });
              if (r.ok) {
                const d = await r.json();
                for (const run of d.workflow_runs || []) {
                  await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs/${run.id}/cancel`, {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${pat}`, Accept: 'application/vnd.github+json' }
                  });
                }
              }
              return res.status(200).json({ success: true });
            } catch (e: any) { return res.status(500).json({ error: e.message }); }
          }
          EOF

          # Buat runner workflow template
          cat << 'EOF' > .github/workflows/backend-runner.yml
          name: VinAI Study Backend Runner
          on: workflow_dispatch
          jobs:
            run-backend:
              runs-on: ubuntu-latest
              timeout-minutes: 90
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with: { python-version: "3.11" }
                - name: Install Paket & Cloudflared
                  run: |
                    sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ind curl jq
                    pip install -r backend/requirements.txt
                    curl -L -o cf.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
                    sudo dpkg -i cf.deb && rm cf.deb
                - name: Jalankan Server & Tunnel
                  env:
                    GH_PAT: __SEC_GH_PAT__
                    GH_TOKEN: __SEC_GH_PAT__
                    GEMINI_API_KEY: __SEC_GEMINI__
                    BACKEND_API_KEY: __SEC_BACKEND__
                  run: |
                    python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
                    cloudflared tunnel --url http://127.0.0.1:8000 > tunnel.log 2>&1 &
                    TUNNEL_URL=""
                    for i in {1..15}; do
                      sleep 2
                      FOUND=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
                      if [ -n "$FOUND" ]; then TUNNEL_URL="$FOUND"; break; fi
                    done
                    if [ -z "$TUNNEL_URL" ]; then exit 1; fi
                    gh variable set BACKEND_URL --body "$TUNNEL_URL"
                    gh variable set BACKEND_STATUS --body "online"
                - name: Keep Alive
                  run: sleep 4500
                - name: Cleanup
                  if: always()
                  env:
                    GH_TOKEN: __SEC_GH_PAT__
                  run: |
                    gh variable set BACKEND_URL --body "" || true
                    gh variable set BACKEND_STATUS --body "offline" || true
          EOF

          # Substitusi sintaks rahasia tanpa bentrok dengan parser YAML
          D='$'
          sed -i "s/__SEC_GH_PAT__/${D}{{ secrets.GH_PAT }}/g" .github/workflows/backend-runner.yml
          sed -i "s/__SEC_GEMINI__/${D}{{ secrets.GEMINI_API_KEY }}/g" .github/workflows/backend-runner.yml
          sed -i "s/__SEC_BACKEND__/${D}{{ secrets.BACKEND_API_KEY }}/g" .github/workflows/backend-runner.yml

      # ==========================================
      # LANGKAH 4: FRONTEND CORE & STATE
      # ==========================================
      - name: 4. Buat Frontend Core
        run: |
          cat << 'EOF' > src/types/index.ts
          export type ServerState = 'idle' | 'starting' | 'online' | 'disconnected' | 'error';
          export interface Material { id: string; subject: string; grade: string; chapter: string; page_number: string; content: string; }
          export interface QuestionHistoryItem { id: string; timestamp: number; subject: string; question: string; answer: string; citations: string[]; }
          EOF

          cat << 'EOF' > src/services/api.ts
          export const callBackend = async (url: string, endpoint: string, options: RequestInit = {}) => {
            if (!url) throw new Error('URL Backend belum tersedia.');
            const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer vinai-secret-default', ...(options.headers || {}) };
            const res = await fetch(`${url}${endpoint}`, { ...options, headers });
            if (!res.ok) {
              const err = await res.json().catch(() => ({ detail: 'Error backend' }));
              throw new Error(err.detail || `Error ${res.status}`);
            }
            return res.json();
          };
          EOF

          cat << 'EOF' > src/context/ServerContext.tsx
          import React, { createContext, useContext, useState, useEffect, useCallback } from 'react';
          import { ServerState } from '../types';

          interface ServerContextType {
            status: ServerState; backendUrl: string; errorMessage: string; appPin: string;
            setAppPin: (pin: string) => void; startServer: () => Promise<void>; stopServer: () => Promise<void>; checkHealth: () => Promise<boolean>;
          }
          const ServerContext = createContext<ServerContextType | undefined>(undefined);

          export const ServerProvider: React.FC<{ children: React.ReactNode }> = ({ children }) => {
            const [status, setStatus] = useState<ServerState>('idle');
            const [backendUrl, setBackendUrl] = useState<string>('');
            const [errorMessage, setErrorMessage] = useState<string>('');
            const [appPin, setAppPinState] = useState<string>(() => localStorage.getItem('vinai_pin') || '123456');

            const setAppPin = (p: string) => { setAppPinState(p); localStorage.setItem('vinai_pin', p); };

            const checkHealth = useCallback(async (targetUrl?: string) => {
              const u = targetUrl || backendUrl;
              if (!u) { setStatus('idle'); return false; }
              try {
                const c = new AbortController();
                const t = setTimeout(() => c.abort(), 4000);
                const r = await fetch(`${u}/health`, { signal: c.signal });
                clearTimeout(t);
                if (r.ok) { setStatus('online'); setErrorMessage(''); return true; }
              } catch {}
              setStatus('disconnected'); return false;
            }, [backendUrl]);

            const pollRegistry = useCallback(async () => {
              try {
                const r = await fetch('/api/backend-url');
                if (r.ok) {
                  const d = await r.json();
                  if (d.url) { setBackendUrl(d.url); await checkHealth(d.url); }
                  else { setBackendUrl(''); setStatus('idle'); }
                }
              } catch {}
            }, [checkHealth]);

            useEffect(() => { pollRegistry(); const i = setInterval(pollRegistry, 15000); return () => clearInterval(i); }, [pollRegistry]);

            const startServer = async () => {
              setStatus('starting');
              try {
                const r = await fetch('/api/start-server', { method: 'POST', headers: { 'x-app-pin': appPin } });
                if (!r.ok) throw new Error('Gagal memulai runner');
              } catch (e: any) { setStatus('error'); setErrorMessage(e.message); }
            };

            const stopServer = async () => {
              await fetch('/api/stop-server', { method: 'POST', headers: { 'x-app-pin': appPin } }).catch(() => {});
              setStatus('idle'); setBackendUrl('');
            };

            return (
              <ServerContext.Provider value={{ status, backendUrl, errorMessage, appPin, setAppPin, startServer, stopServer, checkHealth }}>
                {children}
              </ServerContext.Provider>
            );
          };
          export const useServer = () => useContext(ServerContext)!;
          EOF

          cat << 'EOF' > src/components/ServerStatusBanner.tsx
          import React from 'react';
          import { useServer } from '../context/ServerContext';
          export const ServerStatusBanner: React.FC = () => {
            const { status, errorMessage, startServer } = useServer();
            if (status === 'online') {
              return (
                <div className="bg-emerald-50 border-b border-emerald-200 px-4 py-2 flex items-center space-x-2 text-xs text-emerald-800">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className="font-medium">Server aktif (Siap menjawab PR)</span>
                </div>
              );
            }
            if (status === 'starting') {
              return (
                <div className="bg-amber-50 border-b border-amber-200 px-4 py-2 text-xs text-amber-800 font-medium animate-pulse">
                  ⏳ Menyiapkan server... (estimasi 30–60 detik)
                </div>
              );
            }
            return (
              <div className="bg-rose-50 border-b border-rose-200 p-3 text-xs text-rose-900 flex items-center justify-between">
                <div>
                  <span className="font-semibold block">{status === 'disconnected' ? 'Koneksi terputus' : 'Server belum aktif'}</span>
                  <p className="text-[11px] text-rose-700">{errorMessage || 'Nyalakan server untuk menggunakan AI.'}</p>
                </div>
                <button onClick={startServer} className="ml-2 px-3 py-1.5 bg-rose-600 text-white rounded font-medium text-xs active:scale-95">Aktifkan</button>
              </div>
            );
          };
          EOF

          cat << 'EOF' > src/components/Navbar.tsx
          import React from 'react';
          export const Navbar: React.FC<{ currentTab: string; setCurrentTab: (t: string) => void }> = ({ currentTab, setCurrentTab }) => {
            const tabs = [
              { id: 'dashboard', label: 'Home' }, { id: 'ask', label: 'Tanya PR' },
              { id: 'upload', label: 'Upload Buku' }, { id: 'materials', label: 'Koleksi' },
              { id: 'history', label: 'Riwayat' }, { id: 'settings', label: 'Server' }
            ];
            return (
              <header className="bg-indigo-700 text-white sticky top-0 z-50">
                <div className="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
                  <span className="font-bold tracking-wide">VinAI Study</span>
                  <span className="text-[10px] bg-indigo-900 px-2 py-0.5 rounded text-indigo-200">Mobile Edition</span>
                </div>
                <nav className="flex overflow-x-auto no-scrollbar border-t border-indigo-600 bg-indigo-800 px-2 text-xs">
                  {tabs.map((t) => (
                    <button key={t.id} onClick={() => setCurrentTab(t.id)} className={`py-2 px-3 whitespace-nowrap border-b-2 font-medium ${currentTab === t.id ? 'border-white text-white font-bold' : 'border-transparent text-indigo-200'}`}>
                      {t.label}
                    </button>
                  ))}
                </nav>
              </header>
            );
          };
          EOF

          cat << 'EOF' > src/components/Layout.tsx
