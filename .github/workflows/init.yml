          import React, { useState, useEffect } from 'react';
          import { useServer } from '../context/ServerContext';
          import { callBackend } from '../services/api';
          import { Material } from '../types';
          export const MaterialCollection: React.FC = () => {
            const { status, backendUrl } = useServer();
            const [materials, setMaterials] = useState<Material[]>([]);
            const [search, setSearch] = useState('');

            useEffect(() => {
              if (status === 'online') {
                callBackend(backendUrl, '/api/materials').then((d) => setMaterials(d.materials || [])).catch(() => {});
              }
            }, [status, backendUrl]);

            const filtered = materials.filter((m) => m.subject.toLowerCase().includes(search.toLowerCase()) || m.content.toLowerCase().includes(search.toLowerCase()));
            return (
              <div className="space-y-3 text-xs">
                <h2 className="font-bold text-sm text-slate-800">Koleksi Teks Buku</h2>
                <input type="text" placeholder="Cari materi..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full border p-2 rounded bg-white" />
                {filtered.map((item) => (
                  <div key={item.id} className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-1">
                    <span className="font-bold text-indigo-700">{item.subject} • {item.chapter} (Hal {item.page_number})</span>
                    <p className="text-slate-700 line-clamp-3 bg-slate-50 p-2 rounded">{item.content}</p>
                  </div>
                ))}
              </div>
            );
          };
