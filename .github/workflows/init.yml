          import React, { useState } from 'react';
          import { useServer } from '../context/ServerContext';
          import { callBackend } from '../services/api';

          export const UploadBook: React.FC = () => {
            const { status, backendUrl, startServer } = useServer();
            const [imageB64, setImageB64] = useState<string | null>(null);
            const [ocrLoading, setOcrLoading] = useState(false);
            const [saveLoading, setSaveLoading] = useState(false);
            const [subject, setSubject] = useState('IPA');
            const [grade, setGrade] = useState('7');
            const [chapter, setChapter] = useState('');
            const [pageNumber, setPageNumber] = useState('');
            const [extractedText, setExtractedText] = useState('');
            const [msg, setMsg] = useState('');

            const handleCapture = (e: React.ChangeEvent<HTMLInputElement>) => {
              const file = e.target.files?.[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = () => { setImageB64(reader.result as string); setExtractedText(''); };
              reader.readAsDataURL(file);
            };

            const runOCR = async () => {
              if (!imageB64) return;
              setOcrLoading(true);
              setMsg('');
              try {
                const res = await callBackend(backendUrl, '/api/ocr', { method: 'POST', body: JSON.stringify({ image_base64: imageB64 }) });
                setExtractedText(res.extracted_text || '');
              } catch (err: any) {
                setMsg(`OCR Gagal: ${err.message}`);
              } finally {
                setOcrLoading(false);
              }
            };

            const handleSave = async (e: React.FormEvent) => {
              e.preventDefault();
              setSaveLoading(true);
              try {
                await callBackend(backendUrl, '/api/materials', {
                  method: 'POST',
                  body: JSON.stringify({ subject, grade, chapter: chapter || 'Bab Umum', page_number: pageNumber || '1', content: extractedText }),
                });
                setMsg('✅ Materi berhasil disimpan permanen ke repositori!');
                setExtractedText('');
                setImageB64(null);
              } catch (err: any) {
                setMsg(`Gagal simpan: ${err.message}`);
              } finally {
                setSaveLoading(false);
              }
            };

            return (
              <div className="space-y-4 text-xs">
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                  <h2 className="font-bold text-sm text-slate-800">Scan & Upload Buku Sekolah</h2>
                  {status !== 'online' ? (
                    <div className="bg-rose-50 p-3 rounded text-center text-rose-800">
                      <p>Backend runner belum aktif.</p>
                      <button onClick={startServer} className="mt-2 bg-rose-600 text-white font-bold px-3 py-1.5 rounded">Aktifkan Runner</button>
                    </div>
                  ) : (
                    <>
                      <input type="file" accept="image/*" capture="environment" onChange={handleCapture} className="w-full" />
                      {imageB64 && (
                        <div className="space-y-2">
                          <img src={imageB64} alt="Preview" className="max-h-40 rounded mx-auto" />
                          <button onClick={runOCR} disabled={ocrLoading} className="w-full py-2 bg-emerald-600 text-white font-bold rounded">
                            {ocrLoading ? 'Sedang Membaca Teks (OCR)...' : 'Ekstrak Teks dari Foto'}
                          </button>
                        </div>
                      )}
                      {extractedText && (
                        <form onSubmit={handleSave} className="space-y-2 pt-2 border-t">
                          <div className="grid grid-cols-2 gap-2">
                            <input type="text" placeholder="Mapel (contoh: IPA)" value={subject} onChange={(e) => setSubject(e.target.value)} required className="border p-1.5 rounded" />
                            <input type="text" placeholder="Kelas (contoh: 7)" value={grade} onChange={(e) => setGrade(e.target.value)} required className="border p-1.5 rounded" />
                          </div>
                          <div className="grid grid-cols-2 gap-2">
                            <input type="text" placeholder="Bab (contoh: Bab 2)" value={chapter} onChange={(e) => setChapter(e.target.value)} required className="border p-1.5 rounded" />
                            <input type="text" placeholder="Hal (contoh: Hal 30)" value={pageNumber} onChange={(e) => setPageNumber(e.target.value)} required className="border p-1.5 rounded" />
                          </div>
                          <textarea rows={5} value={extractedText} onChange={(e) => setExtractedText(e.target.value)} className="w-full border p-2 rounded font-mono" />
                          <button type="submit" disabled={saveLoading} className="w-full bg-indigo-600 text-white font-bold py-2 rounded">
                            {saveLoading ? 'Menyimpan...' : 'Simpan Materi Buku'}
                          </button>
                        </form>
                      )}
                      {msg && <p className="text-slate-600">{msg}</p>}
                    </>
                  )}
                </div>
              </div>
            );
          };
